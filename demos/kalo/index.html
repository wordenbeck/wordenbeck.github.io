<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalo — Klickbarer Prototyp</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* ── Kalo Design Tokens (aus src/index.css) ── */
  :root {
    --bg-page:        #f9fafb;
    --bg-card:        #ffffff;
    --bg-muted:       #f3f4f6;
    --bg-green:       #f0fdf4;
    --bg-green-light: #dcfce7;
    --text-1: #111827;
    --text-2: #374151;
    --text-3: #6b7280;
    --text-4: #9ca3af;
    --border: #e5e7eb;
    --green:          #16a34a;
    --green-hover:    #15803d;
    --water-track:      #e0f2fe;
    --water-ring:       #0ea5e9;
    --water-btn-bg:     #f0f9ff;
    --water-btn-border: #e0f2fe;
    --water-btn-text:   #0369a1;
    --orange: #f97316;
    --shadow-card:    0 1px 4px rgba(0,0,0,0.06);
    --shadow-card-lg: 0 4px 24px rgba(0,0,0,0.08);
    --auth-gradient: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
  }

  html, body { font-family: system-ui, -apple-system, sans-serif; background: #e5e7eb; color: var(--text-1); -webkit-font-smoothing: antialiased; }

  /* ── Overview / Grid ── */
  .overview { padding: 32px 24px 80px; }
  .overview-header {
    max-width: 1240px; margin: 0 auto 32px;
    display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  .overview-title { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
  .overview-sub { color: var(--text-3); font-size: 15px; }
  .overview-hint { color: var(--text-3); font-size: 13px; background: white; padding: 8px 14px; border-radius: 10px; }
  .grid {
    max-width: 1240px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
  }
  .group-title { grid-column: 1 / -1; font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-3); margin: 20px 0 -4px; }
  .thumb {
    background: white; border-radius: 20px; overflow: hidden; cursor: pointer; border: 1px solid var(--border);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .thumb:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,.08); }
  .thumb-preview {
    height: 200px; background: var(--auth-gradient); display: flex; align-items: center; justify-content: center;
  }
  .thumb-preview-inner {
    width: 140px; height: 250px; background: var(--bg-page); border-radius: 22px; border: 6px solid #111;
    overflow: hidden; position: relative; transform: scale(0.8);
  }
  .thumb-info { padding: 14px 18px; border-top: 1px solid var(--border); }
  .thumb-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .thumb-desc { font-size: 12px; color: var(--text-3); }

  /* ── Detail View mit iPhone-Frame ── */
  .detail { display: none; min-height: 100vh; background: #1a1d24; padding: 40px 20px; }
  .detail.active { display: flex; align-items: flex-start; justify-content: center; gap: 40px; flex-wrap: wrap; }
  .detail-nav { max-width: 260px; color: white; }
  .detail-back {
    background: #2a2e36; color: white; border: none; padding: 10px 18px; border-radius: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 24px;
  }
  .detail-back:hover { background: #363a44; }
  .detail-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .detail-desc { font-size: 13px; color: #a0a5b1; line-height: 1.5; margin-bottom: 24px; }
  .detail-flow-title { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: #a0a5b1; margin-bottom: 8px; }
  .detail-flow-list { display: flex; flex-direction: column; gap: 6px; }
  .detail-flow-list a {
    color: var(--green); font-size: 13px; text-decoration: none; padding: 8px 10px; border-radius: 8px;
    background: rgba(22,163,74,0.12); cursor: pointer;
  }
  .detail-flow-list a:hover { background: rgba(22,163,74,0.22); }

  /* ── iPhone Frame ── */
  .iphone {
    width: 390px; height: 844px; background: #111; border-radius: 55px;
    padding: 12px; box-shadow: 0 30px 80px rgba(0,0,0,0.4); position: relative; flex-shrink: 0;
  }
  .iphone-notch {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 32px; background: #111; border-radius: 0 0 20px 20px; z-index: 20;
  }
  .iphone-screen {
    width: 100%; height: 100%; background: var(--bg-page); border-radius: 44px; overflow: hidden;
    position: relative; display: flex; flex-direction: column;
  }
  .status-bar {
    padding: 14px 28px 6px; display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; font-weight: 600; color: var(--text-1); flex-shrink: 0;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; font-size: 12px; }

  /* ── Shared: .page + Container ── */
  .kalo-app { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .kalo-app::-webkit-scrollbar { display: none; }
  .page, .dashboard {
    max-width: 480px; margin: 0 auto;
    padding: 20px 16px 100px;
    background: var(--bg-page);
    min-height: 100%;
  }

  /* ── Page Header (Meals-Style) ── */
  .page-header {
    display: flex; align-items: center; margin-bottom: 20px;
  }
  .back-btn {
    background: var(--bg-muted); border: none; border-radius: 10px; padding: 8px 12px; cursor: pointer;
    color: var(--text-2); display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
  }
  .page-title {
    flex: 1; text-align: center; font-size: 18px; font-weight: 700; color: var(--text-1); margin: 0;
  }
  .page-header-spacer { width: 36px; }

  /* ── Icon Buttons ── */
  .icon-btn {
    background: var(--bg-muted); border: none; border-radius: 10px; padding: 8px 10px; cursor: pointer;
    color: var(--text-3); display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
  }

  /* ── Dashboard Header ── */
  .dash-header {
    position: relative; text-align: center; margin-bottom: 20px; padding: 0 132px 0 40px;
  }
  .dash-date { font-size: 13px; color: var(--text-4); margin: 0 0 4px; }
  .dash-greeting { font-size: 20px; font-weight: 700; color: var(--text-1); margin: 0 0 2px; }
  .dash-header-actions { position: absolute; right: 0; top: 0; display: flex; gap: 6px; }

  /* ── Card ── */
  .dash-card {
    background: var(--bg-card); border-radius: 20px; padding: 20px; margin-bottom: 12px;
    box-shadow: var(--shadow-card);
  }
  .card-title-row {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
  }
  .card-title-left { display: flex; align-items: center; gap: 6px; }
  .card-title {
    font-size: 12px; font-weight: 600; color: var(--text-4);
    text-transform: uppercase; letter-spacing: 0.06em; margin: 0;
  }
  .card-nav-btn {
    background: var(--bg-muted); border: none; border-radius: 8px; padding: 6px 8px;
    color: var(--text-3); cursor: pointer; display: flex; align-items: center;
  }

  /* ── Donut ── */
  .donut-layout { display: flex; align-items: center; gap: 20px; }
  .donut-box { position: relative; width: 140px; height: 140px; flex-shrink: 0; }
  .donut-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none;
  }
  .donut-remaining { display: block; font-size: 24px; font-weight: 700; line-height: 1; color: var(--green); }
  .donut-label { display: block; font-size: 11px; color: var(--text-4); margin-top: 3px; }
  .calorie-stats-col { flex: 1; display: flex; flex-direction: column; padding-left: 8px; }
  .calorie-stat-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0;
  }
  .calorie-divider-h { height: 1px; background: var(--border); }
  .calorie-num { display: block; font-size: 16px; font-weight: 700; color: var(--text-1); line-height: 1; }
  .calorie-lbl { display: block; font-size: 11px; color: var(--text-4); margin-top: 2px; }
  .calorie-add-chip {
    display: flex; align-items: center; gap: 4px;
    background: var(--bg-green); color: var(--green);
    padding: 8px 11px; border-radius: 12px; flex-shrink: 0; font-size: 12px;
  }

  /* ── Macro Rings ── */
  .macro-rings-row { display: flex; justify-content: space-around; gap: 8px; }
  .macro-ring-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .macro-ring-svg { position: relative; width: 68px; height: 68px; }
  .macro-ring-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
  }
  .macro-ring-val { font-size: 12px; font-weight: 700; line-height: 1; }
  .macro-ring-goal { font-size: 11px; color: var(--text-3); font-weight: 500; }
  .macro-ring-label { font-size: 11px; color: var(--text-4); display: flex; align-items: center; gap: 3px; }

  /* ── Water ── */
  .water-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .water-header .card-title { margin: 0; }
  .water-content { display: flex; align-items: center; gap: 14px; }
  .water-ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
  .water-ring-box { position: relative; width: 90px; height: 90px; }
  .water-ring-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
  }
  .water-text-col { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-left: 12px; }
  .water-text-row { display: flex; flex-direction: column; gap: 1px; }
  .water-text-label { font-size: 11px; color: var(--text-4); }
  .water-text-value { font-size: 20px; font-weight: 700; color: var(--text-1); line-height: 1; }
  .water-btns-col { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; min-width: 80px; }
  .water-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 10px 8px; background: var(--water-btn-bg);
    border: 1.5px solid var(--water-btn-border); border-radius: 12px; cursor: pointer;
    width: 100%;
  }
  .water-btn-icon-row { display: flex; align-items: center; gap: 3px; color: var(--water-btn-text); font-size: 13px; }
  .water-btn-name { font-size: 12px; font-weight: 600; color: var(--water-btn-text); line-height: 1; }
  .water-btn-ml { font-size: 10px; color: var(--water-btn-text); opacity: 0.7; }

  /* ── Log entries ── */
  .log-list { display: flex; flex-direction: column; gap: 6px; }
  .log-entry {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
  }
  .log-icon {
    width: 28px; height: 28px; border-radius: 8px; background: var(--bg-muted);
    display: flex; align-items: center; justify-content: center; color: var(--text-4);
  }
  .log-label { flex: 1; font-size: 13px; color: var(--text-2); }
  .log-kcal { font-size: 13px; color: var(--green); font-weight: 600; }

  /* ── Bottom Nav (BottomNav.css 1:1) ── */
  .bn-root {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; justify-content: space-around; align-items: center;
    padding: 8px 8px 20px;
    background: var(--bg-card); border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
  }
  .bn-item {
    flex: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center;
    gap: 3px; padding: 6px 2px; font-size: 10px; color: var(--text-3); cursor: pointer;
    position: relative;
  }
  .bn-item--active { color: #3b82f6; }
  .bn-item--active::after {
    content: ''; position: absolute; top: -8px; left: 50%; width: 28px; height: 2px;
    background: #3b82f6; border-radius: 2px; transform: translateX(-50%);
  }
  .bn-fab-wrap {
    flex: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center;
    gap: 3px; cursor: pointer; padding: 0;
  }
  .bn-fab {
    width: 48px; height: 48px; border-radius: 50%; background: var(--green); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: -22px; box-shadow: 0 6px 18px rgba(34, 197, 94, 0.5);
  }
  .bn-fab-label { color: var(--green); font-size: 10px; font-weight: 600; }

  /* ── Rezepte Tiles ── */
  .rz-intro { font-size: 14px; color: var(--text-3); margin: 0 0 18px; padding: 0 4px; }
  .rz-tiles { display: flex; flex-direction: column; gap: 12px; }
  .rz-tile {
    display: flex; align-items: center; gap: 14px; padding: 18px 16px;
    background: var(--bg-card); border: 0; border-radius: 18px;
    box-shadow: var(--shadow-card); cursor: pointer; text-align: left;
    width: 100%;
  }
  .rz-tile-icon {
    width: 52px; height: 52px; border-radius: 14px;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .rz-tile-body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .rz-tile-title { font-size: 16px; font-weight: 700; color: var(--text-1); }
  .rz-tile-sub { font-size: 12px; color: var(--text-4); }
  .rz-tile-arrow { color: var(--text-4); }

  /* ── Auth (Login/Register) ── */
  .auth-container {
    height: 100%; display: flex; align-items: center; justify-content: center;
    background: var(--auth-gradient); padding: 24px;
  }
  .auth-card {
    background: var(--bg-card); border-radius: 24px; padding: 40px 32px;
    width: 100%; max-width: 400px; box-shadow: var(--shadow-card-lg);
  }
  .auth-logo { font-size: 48px; text-align: center; margin-bottom: 8px; }
  .auth-title { font-size: 32px; font-weight: 700; text-align: center; color: var(--green); margin: 0 0 4px; }
  .auth-subtitle { font-size: 16px; color: var(--text-3); text-align: center; margin: 0 0 32px; }
  .auth-form { display: flex; flex-direction: column; gap: 16px; }
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-group label { font-size: 14px; font-weight: 500; color: var(--text-2); }
  .input-group input {
    padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 12px;
    font-size: 16px; outline: none; background: var(--bg-card); color: var(--text-1);
    -webkit-appearance: none; font-family: inherit;
  }
  .input-group input:focus { border-color: var(--green); }
  .auth-button {
    margin-top: 8px; padding: 14px; background: var(--green); color: white;
    border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .auth-switch { font-size: 13px; text-align: center; color: var(--text-3); margin-top: 16px; }
  .auth-switch a { color: var(--green); text-decoration: none; font-weight: 600; }
  .auth-version { text-align: center; font-size: 11px; color: var(--text-4); margin-top: 20px; }

  /* ── Onboarding ── */
  .onboarding-container {
    height: 100%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); padding: 24px;
  }
  .onboarding-card {
    background: white; border-radius: 24px; padding: 32px 28px;
    width: 100%; max-width: 440px; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .progress-bar { height: 6px; background: #e5e7eb; border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .progress-fill { height: 100%; background: #16a34a; border-radius: 99px; }
  .progress-label { font-size: 13px; color: #9ca3af; margin: 0 0 24px; }
  .step-emoji { font-size: 40px; margin-bottom: 8px; }
  .step h2 { font-size: 22px; font-weight: 700; color: #111827; margin: 0 0 6px; }
  .step-sub { font-size: 14px; color: #6b7280; margin: 0 0 24px; }
  .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .option-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .option-btn {
    padding: 10px 8px; border: 1.5px solid #e5e7eb; border-radius: 12px;
    background: white; font-size: 13px; cursor: pointer; color: #374151; font-family: inherit;
  }
  .option-btn.active { border-color: #16a34a; background: #f0fdf4; color: #16a34a; font-weight: 600; }
  .option-list { display: flex; flex-direction: column; gap: 8px; }
  .option-list-btn {
    padding: 14px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px;
    background: white; text-align: left; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; gap: 12px;
  }
  .option-list-btn.active { border-color: #16a34a; background: #f0fdf4; }
  .option-list-emoji { font-size: 22px; }
  .option-list-label { font-size: 15px; font-weight: 500; color: #111827; }
  .ob-primary {
    margin-top: 20px; padding: 14px; background: var(--green); color: white; border: none;
    border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%;
    font-family: inherit;
  }
  .ob-primary:disabled { background: #86efac; }

  /* ── Meals ── */
  .meal-type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
  .meal-type-card {
    position: relative; background: var(--bg-card); border: none; border-radius: 18px;
    padding: 16px; cursor: pointer; box-shadow: var(--shadow-card); text-align: left;
    display: flex; flex-direction: column; gap: 8px;
  }
  .meal-type-top { display: flex; justify-content: space-between; align-items: center; }
  .meal-type-icon {
    width: 36px; height: 36px; background: var(--bg-green); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .meal-type-plus {
    width: 28px; height: 28px; background: var(--green); color: white; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .meal-type-label { font-size: 15px; font-weight: 600; color: var(--text-1); }
  .meal-type-badge {
    position: absolute; top: 10px; right: 10px; background: var(--bg-green-light);
    color: var(--green); font-size: 11px; font-weight: 700; border-radius: 99px; padding: 2px 7px;
  }

  .chat-card {
    background: var(--bg-card); border-radius: 20px; padding: 16px;
    box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 14px;
  }
  .meal-type-tabs { display: flex; gap: 6px; }
  .meal-tab {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 7px 4px; border: 1.5px solid var(--border); border-radius: 10px;
    background: transparent; font-size: 11px; font-weight: 500; color: var(--text-3);
    cursor: pointer; font-family: inherit;
  }
  .meal-tab.active {
    border-color: var(--green); background: var(--bg-green); color: var(--green); font-weight: 600;
  }
  .chat-msg {
    background: var(--bg-muted); border-radius: 14px; padding: 10px 12px; font-size: 13px; color: var(--text-2); line-height: 1.4;
  }
  .chat-msg.user { background: var(--bg-green); color: var(--text-1); align-self: flex-end; max-width: 82%; }
  .chat-msg.bot { max-width: 90%; }
  .chat-input-row {
    display: flex; gap: 8px; align-items: center; padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .chat-input {
    flex: 1; border: 1.5px solid var(--border); border-radius: 12px;
    padding: 10px 14px; font-size: 14px; outline: none; background: var(--bg-page);
    color: var(--text-1); font-family: inherit;
  }
  .chat-send {
    width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--green);
    color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  /* ── Sport ── */
  .sport-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .sport-btn {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 8px; border: 1.5px solid var(--border); border-radius: 14px;
    background: var(--bg-card); cursor: pointer; font-family: inherit;
  }
  .sport-btn.active {
    border-color: var(--green); background: var(--bg-green); transform: scale(1.02);
  }
  .sport-icon {
    width: 36px; height: 36px; border-radius: 10px; background: var(--bg-muted);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .sport-btn.active .sport-icon { background: var(--bg-green-light); }
  .sport-name { font-size: 11px; font-weight: 500; color: var(--text-2); }
  .sport-btn.active .sport-name { color: var(--green); font-weight: 600; }

  /* ── Kochbuch ── */
  .kb-add-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px 16px; margin-bottom: 16px;
    background: var(--green); color: white; border: none; border-radius: 14px;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .kb-card {
    display: flex; align-items: stretch; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    margin-bottom: 10px; cursor: pointer;
  }
  .kb-thumb {
    width: 76px; flex-shrink: 0; background: linear-gradient(135deg, #ffcc80, #f97316);
    display: flex; align-items: center; justify-content: center; font-size: 32px;
  }
  .kb-body { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .kb-title { font-size: 14px; font-weight: 600; color: var(--text-1); }
  .kb-desc { font-size: 12px; color: var(--text-3); }
  .kb-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--text-4); margin-top: 4px; }
  .kb-source-link { color: #3b82f6; text-decoration: none; }

  /* ── Wochenplan ── */
  .wp-day {
    background: var(--bg-card); border-radius: 16px; padding: 14px; margin-bottom: 10px;
    box-shadow: var(--shadow-card);
  }
  .wp-day.today { border: 2px solid var(--green); }
  .wp-day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .wp-day-name { font-size: 15px; font-weight: 700; color: var(--text-1); }
  .wp-day-date { font-size: 12px; color: var(--text-4); }
  .wp-slot { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .wp-slot:first-of-type { border-top: 0; }
  .wp-slot-time { color: var(--text-4); min-width: 56px; font-size: 12px; }
  .wp-slot-name { flex: 1; color: var(--text-2); }
  .wp-slot-empty { color: var(--text-4); font-style: italic; }

  /* ── Verlauf ── */
  .day-entry {
    background: var(--bg-card); border-radius: 14px; padding: 14px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: var(--shadow-card);
  }
  .day-entry-name { font-size: 14px; font-weight: 600; color: var(--text-1); }
  .day-entry-date { font-size: 11px; color: var(--text-4); margin-top: 2px; }
  .day-entry-stats { text-align: right; }
  .day-entry-kcal { font-size: 14px; font-weight: 700; color: var(--text-1); }
  .day-entry-goal { font-size: 11px; margin-top: 2px; }
  .day-entry-goal.ok { color: var(--green); }
  .day-entry-goal.over { color: #ef4444; }

  /* ── Section title ── */
  .section-title {
    font-size: 12px; font-weight: 600; color: var(--text-4);
    text-transform: uppercase; letter-spacing: 0.06em; margin: 20px 0 10px; padding: 0 4px;
  }

  /* ── Profile ── */
  .profile-hero { text-align: center; padding: 12px 0 20px; }
  .profile-avatar {
    width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 12px;
    background: var(--green); color: white; display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 700;
  }
  .profile-name { font-size: 20px; font-weight: 700; }
  .profile-email { font-size: 13px; color: var(--text-3); margin-top: 2px; }

  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: var(--bg-card); margin-bottom: 6px;
    border-radius: 12px; font-size: 14px; cursor: pointer;
    box-shadow: var(--shadow-card);
  }
  .settings-row-left { display: flex; align-items: center; gap: 12px; }
  .settings-row-icon {
    width: 32px; height: 32px; border-radius: 8px; background: var(--bg-muted);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .settings-row-arrow { color: var(--text-4); font-size: 18px; }

  /* ── Kochbuch Detail ── */
  .kb-detail-image { height: 220px; background: linear-gradient(135deg, #ffcc80, #f97316); display: flex; align-items: center; justify-content: center; font-size: 80px; position: relative; }
  .kb-back-overlay {
    position: absolute; top: 16px; left: 16px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
    border: none; border-radius: 12px; padding: 8px 12px; cursor: pointer; color: var(--text-1);
    display: flex; align-items: center;
  }
  .kb-detail-body { padding: 20px; }
  .kb-detail-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; color: var(--text-1); }
  .kb-detail-source { font-size: 13px; color: #3b82f6; margin-bottom: 14px; text-decoration: none; }
  .kb-detail-meta { display: flex; gap: 14px; color: var(--text-3); font-size: 12px; margin-bottom: 16px; }
  .kb-macros-card {
    background: var(--bg-card); border-radius: 14px; padding: 12px 16px;
    display: flex; justify-content: space-around; margin-bottom: 20px;
    box-shadow: var(--shadow-card);
  }
  .kb-macros-item { text-align: center; }
  .kb-macros-value { font-size: 18px; font-weight: 700; color: var(--text-1); }
  .kb-macros-label { font-size: 10px; color: var(--text-4); }
  .kb-section { margin-bottom: 22px; }
  .kb-section-title {
    font-size: 12px; font-weight: 600; color: var(--text-4);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px;
  }
  .kb-ingredient { font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--border); color: var(--text-2); }
  .kb-ingredient:last-child { border-bottom: none; }
  .kb-step { font-size: 14px; line-height: 1.5; padding: 8px 0; display: flex; gap: 10px; color: var(--text-2); }
  .kb-step-num { font-weight: 700; color: var(--green); flex-shrink: 0; }

  /* Import Dialog */
  .import-form-input {
    width: 100%; padding: 12px 14px 12px 40px; border: 1.5px solid var(--border);
    border-radius: 12px; font-size: 14px; outline: none; background: var(--bg-card);
    color: var(--text-1); font-family: inherit;
  }
  .import-input-wrap { position: relative; margin-bottom: 12px; }
  .import-input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-4); }
  .import-btn {
    padding: 12px; background: var(--green); color: white; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; font-family: inherit;
  }

  /* Weekly Review */
  .wr-hero { text-align: center; padding: 8px 0 20px; }
  .wr-hero-emoji { font-size: 42px; margin-bottom: 8px; }
  .wr-hero-title { font-size: 20px; font-weight: 700; }
  .wr-hero-sub { font-size: 12px; color: var(--text-4); margin-top: 2px; }
  .stat-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 14px; }
  .stat-row + .stat-row { border-top: 1px solid var(--border); }
  .stat-row .lbl { color: var(--text-3); }
  .stat-row .val { font-weight: 600; color: var(--text-1); }

  /* Search input */
  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-input {
    width: 100%; padding: 10px 14px 10px 38px; border: 1.5px solid var(--border);
    border-radius: 12px; font-size: 14px; background: var(--bg-card); color: var(--text-1);
    outline: none; font-family: inherit;
  }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-4); }

  /* Favoriten */
  .fav-item {
    background: var(--bg-card); border-radius: 14px; padding: 14px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-card);
  }
  .fav-item-body { flex: 1; }
  .fav-item-name { font-size: 14px; font-weight: 600; color: var(--text-1); }
  .fav-item-meta { font-size: 11px; color: var(--text-4); margin-top: 2px; }
  .fav-add-btn {

  .ek-item {
    background: var(--bg-card); border-radius: 12px; padding: 12px 16px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-card);

  .ring-track { fill: none; stroke: var(--border); stroke-width: 10; }
  .ring-progress { fill: none; stroke-width: 10; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .macro-ring-track { fill: none; stroke: var(--border); stroke-width: 6; }
  .macro-ring-progress { fill: none; stroke-width: 6; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .water-ring-track { fill: none; stroke: var(--water-track); stroke-width: 8; }
  .water-ring-progress { fill: none; stroke: var(--water-ring); stroke-width: 8; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }

// ==================================================================
// Donut ring for calories
// ==================================================================
function donutRing(consumed, goal) {
  const pct = Math.min(1, consumed / goal);
  const R = 60;
  const C = 2 * Math.PI * R;
  const offset = C * (1 - pct);
  return `
    <svg width="140" height="140" viewBox="0 0 140 140">
      <circle cx="70" cy="70" r="${R}" class="ring-track"/>
      <circle cx="70" cy="70" r="${R}" class="ring-progress"
        stroke="var(--green)" stroke-dasharray="${C}" stroke-dashoffset="${offset}"/>
    </svg>
  `;
}

function macroRing(current, goal, color, iconSvg, label) {
  const pct = Math.min(1, current / goal);
  const R = 28;
  const C = 2 * Math.PI * R;
  const offset = C * (1 - pct);
  return `
    <div class="macro-ring-item">
      <div class="macro-ring-svg">
        <svg width="68" height="68" viewBox="0 0 68 68">
          <circle cx="34" cy="34" r="${R}" class="macro-ring-track"/>
          <circle cx="34" cy="34" r="${R}" class="macro-ring-progress"
            stroke="${color}" stroke-dasharray="${C}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="macro-ring-center">
          <span class="macro-ring-val" style="color:${color}">${current}</span>
        </div>
      </div>
      <span class="macro-ring-goal">${current}/${goal}g</span>
      <span class="macro-ring-label" style="color: ${color};">${iconSvg}${label}</span>
    </div>
  `;
}

function waterRing(currentMl, goalMl) {
  const pct = Math.min(1, currentMl / goalMl);
  const R = 36;
  const C = 2 * Math.PI * R;
  const offset = C * (1 - pct);
  return `
    <svg width="90" height="90" viewBox="0 0 90 90">
      <circle cx="45" cy="45" r="${R}" class="water-ring-track"/>
      <circle cx="45" cy="45" r="${R}" class="water-ring-progress"
        stroke-dasharray="${C}" stroke-dashoffset="${offset}"/>
    </svg>
  `;
}

          <div style="height: 140px; background: linear-gradient(180deg, rgba(22,163,74,0.08) 0%, transparent 100%); border-radius: 10px;">
            <svg viewBox="0 0 300 140" style="width: 100%; height: 100%;">
              <polyline points="0,40 30,45 60,42 90,50 120,48 150,55 180,52 210,60 240,58 270,65 300,68" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--text-4);">
            <span>vor 30 T · 83.2 kg</span>
            <span>heute · 82.1 kg</span>
          </div>
        </div>
      </div>
    `
  }
};

// ==================================================================
// Screen List (order in overview)
// ==================================================================
const groups = [
  { title: 'Auth & Onboarding', ids: ['login', 'register', 'ob-1', 'ob-2', 'ob-3', 'ob-4'] },
  { title: 'Haupt-Tabs (Bottom-Nav)', ids: ['dashboard', 'meals', 'sport', 'rezepte', 'einkaufsliste'] },
  { title: 'Rezepte', ids: ['kochbuch', 'kochbuch-detail', 'kochbuch-import', 'wochenplan', 'favoriten'] },
  { title: 'Weiteres', ids: ['verlauf', 'weekly-review', 'profile', 'settings', 'gewicht'] }
];

// ==================================================================
// Render overview
// ==================================================================
function renderOverview() {
  const gridEl = document.getElementById('grid');
  let html = '';
  for (const g of groups) {
    html += `<div class="group-title">${g.title}</div>`;
    for (const id of g.ids) {
      const s = screens[id];
      html += `
        <div class="thumb" onclick="show('${id}')">
          <div class="thumb-preview">
            <div class="thumb-preview-inner">
              <div style="width: 100%; height: 100%; overflow: hidden; position: relative; pointer-events: none; transform-origin: top left; transform: scale(0.36); width: 278%; height: 278%;">
                ${s.body}
              </div>
            </div>
          </div>
          <div class="thumb-info">
            <div class="thumb-name">${s.title}</div>
            <div class="thumb-desc">${s.desc}</div>
          </div>
        </div>
      `;
    }
  }
  gridEl.innerHTML = html;
}

function show(id) {
  const s = screens[id];
  if (!s) return;
  document.getElementById('overview').style.display = 'none';
  const c = document.getElementById('detail-container');
  c.classList.add('active');
  c.innerHTML = `
    <div class="detail-nav">
      <button class="detail-back" onclick="goHome()">← Übersicht</button>
      <div class="detail-title">${s.title}</div>
      <div class="detail-desc">${s.desc}</div>
      <div class="detail-flow-title">Verwandte Screens</div>
      <div class="detail-flow-list">
        ${s.flows.map(f => `<a onclick="show('${f.to}')">${f.name} →</a>`).join('')}
      </div>
    </div>
    <div class="iphone">
      <div class="iphone-notch"></div>
      <div class="iphone-screen">
        <div class="status-bar">
          <span>${s.time}</span>
          <span class="status-icons">●●●● 🔋</span>
        </div>
        <div class="kalo-app">${s.body}</div>
      </div>
    </div>
  `;
  window.scrollTo(0, 0);
  history.replaceState(null, '', '#' + id);
}

function goHome() {
  document.getElementById('overview').style.display = 'block';
  document.getElementById('detail-container').classList.remove('active');
  history.replaceState(null, '', location.pathname);
  window.scrollTo(0, 0);
}

renderOverview();

const initial = location.hash.replace('#', '');
if (initial && screens[initial]) show(initial);
</script>


<style>
  html,body{background:#f8fafc!important;overflow:hidden!important}
  #overview,.detail-nav,.iphone-notch,.status-bar{display:none!important}
  #detail-container{display:block!important;padding:0!important;margin:0!important}
  .iphone{transform:none!important;position:fixed!important;inset:0!important;width:100%!important;height:100%!important;
    padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;margin:0!important}
  .iphone-screen{width:100%!important;height:100%!important;border-radius:0!important}
</style>
<script>window.addEventListener('load',()=>show('dashboard'));</script>
</body>
</html>
