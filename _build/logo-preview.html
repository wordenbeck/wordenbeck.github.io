<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#000;color:#f5f5f7;font:17px -apple-system,Inter,sans-serif;letter-spacing:-.02em}
.v{padding:0 0 56px;border-bottom:1px solid #38383a}
.label{padding:24px 40px 0;color:#86868b;font-weight:600;font-size:14px}
.bar{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 40px;margin-top:14px;background:#161617;border-bottom:1px solid #2c2c2e}
.who{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
.nav{font-size:13px;color:#d2d2d7;display:flex;gap:22px}
.tabs{display:flex;gap:10px;align-items:center}
.tab{display:flex;align-items:center;gap:8px;background:#2c2c2e;border-radius:10px;padding:7px 12px;font-size:13px}
.hero{text-align:center;padding:56px 0 0}
.hero h1{display:inline-flex;align-items:center;gap:20px;margin:0;font-size:64px;line-height:1.06;font-weight:700;letter-spacing:-.03em}
.slogan{font-size:28px;font-weight:600;color:#86868b;margin-top:12px;letter-spacing:-.02em}
.d .big{width:64px;height:64px;border-radius:15px;box-shadow:0 8px 24px rgba(0,113,227,.25)}
.e .big{width:60px;height:60px}
</style></head><body>
<script>
for (const [v,name,file] of [['d','D · Stift mit Funkeln, weiß auf Blau','logo-d.svg'],['e','E · Nur das Icon in Blau, ohne Hintergrund','logo-e.svg']]) {
  document.body.insertAdjacentHTML('beforeend', `<section class="v ${v}"><div class="label">${name}</div>
  <div class="bar"><div class="who"><img src="../icons/${file}" width="24" height="24" style="border-radius:6px">Thomas Wordenbeck</div>
    <div class="tabs"><span class="tab"><img src="../icons/${file}" width="16" height="16">Tab im Browser</span><span class="nav">Projekte ⌄ &nbsp; Warum diese Seite &nbsp; Über mich</span></div></div>
  <div class="hero"><h1><img class="big" src="../icons/${file}">Thomas Wordenbeck</h1><div class="slogan">Erst das Problem. Dann das Werkzeug.</div></div></section>`);
}
</script></body></html>
