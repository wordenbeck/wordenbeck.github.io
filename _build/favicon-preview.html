<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:600 15px -apple-system,Inter,sans-serif;display:grid;grid-template-columns:1fr 1fr}
.side{padding:28px 32px}.dark{background:#000;color:#f5f5f7}.light{background:#f5f5f7;color:#1d1d1f}
.row{display:flex;align-items:center;gap:28px;margin:18px 0}.row b{width:24px}
.tab{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;font:500 13px -apple-system,Inter,sans-serif}
.dark .tab{background:#2c2c2e}.light .tab{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
</style></head><body>
<div class="side dark"><div>Dunkel</div></div><div class="side light"><div>Hell</div></div>
<script>
for(const side of document.querySelectorAll('.side')){
  for(const v of ['a','b','c']){
    const r=document.createElement('div');r.className='row';
    r.innerHTML=`<b>${v.toUpperCase()}</b>`+[16,32,64,128].map(s=>`<img src="../icons/favicon-${v}.svg" width="${s}" height="${s}">`).join('')+
      `<span class="tab"><img src="../icons/favicon-${v}.svg" width="16" height="16">Thomas Wordenbeck</span>`;
    side.appendChild(r);
  }
}
</script></body></html>
